<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — LIMON</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05060f;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 420px; }
      .logo {
        width: 72px; height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #1877f2, #7b61ff 55%, #d9a441);
        font-size: 36px; font-weight: 700; color: #fff;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #94a3b8; line-height: 1.6; margin: 0 0 6px; }
      button {
        margin-top: 20px;
        min-height: 44px;
        padding: 0 22px;
        border: 0; border-radius: 9999px;
        background: #1877f2; color: #fff;
        font-size: 15px; font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">L</div>
      <h1>You are offline</h1>
      <p>ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না। সংযোগ ফিরে এলে আবার চেষ্টা করুন।</p>
      <p>This page needs the internet for live content — please reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
