<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — LIMON</title>
    <style>
      body { margin:0; min-height:100svh; display:flex; align-items:center; justify-content:center; background:#05060f; color:#e2e8f0; font-family: system-ui, sans-serif; text-align:center; padding:24px; }
      .card { max-width:420px; }
      h1 { font-size:64px; margin:0; background:linear-gradient(92deg,#4da3ff,#7b61ff,#d9a441); -webkit-background-clip:text; background-clip:text; color:transparent; }
      p { color:#94a3b8; line-height:1.6; }
      a { display:inline-block; margin-top:18px; padding:12px 26px; border-radius:999px; background:linear-gradient(92deg,#1877f2,#7b61ff); color:#fff; text-decoration:none; font-weight:600; }
    </style>
    <script>
      // Static-host friendly: bounce unknown paths back to the site root
      // (keeping the repo subpath on GitHub Pages), where the SPA lives.
      (function () {
        var seg = location.pathname.split('/').filter(Boolean);
        var root = location.origin + (seg.length ? '/' + seg[0] + '/' : '/');
        setTimeout(function () { location.replace(root); }, 1600);
        document.addEventListener('DOMContentLoaded', function () {
          document.getElementById('home-link').setAttribute('href', root);
        });
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <p>This page drifted off into space. Taking you back to LIMON's world…</p>
      <a id="home-link" href="https://mamun-q.github.io/mamunhossen-profile/">Go to the homepage</a>
    </div>
  </body>
</html>
