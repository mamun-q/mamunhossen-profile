<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site check</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 20px;
        background: #0b0e1a;
        color: #fff;
      }
      .box {
        background: #171b30;
        border-radius: 12px;
        padding: 14px;
        margin-top: 16px;
        word-break: break-all;
        font-size: 15px;
        line-height: 1.7;
      }
      .big {
        font-size: 20px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Site check page</h1>
    <p class="big" id="status">⏳ পরীক্ষা চলছে… একটু অপেক্ষা করো, কিছু চাপ দিতে হবে না।</p>
    <div class="box" id="report">মূল সাইটটা ভেতরে লোড হচ্ছে…</div>

    <script>
      var SB_URL = 'https://ouyuijpxhhvtnxnvavza.supabase.co/rest/v1/site_messages';
      var SB_KEY = 'sb_publishable_-hldx2wyXfAjxFLAZf4sHA_uu72VfTn';
      var statusEl = document.getElementById('status');
      var reportEl = document.getElementById('report');

      function sendReport(text) {
        return fetch(SB_URL, {
          method: 'POST',
          headers: {
            apikey: SB_KEY,
            Authorization: 'Bearer ' + SB_KEY,
            'Content-Type': 'application/json',
            Prefer: 'return=minimal',
          },
          body: JSON.stringify({
            id: 'msg_diag_' + Date.now().toString(36),
            name: 'Auto diagnostic',
            email: 'check@local',
            message: text.slice(0, 1900),
            createdAt: Date.now(),
          }),
        });
      }

      var frame = document.createElement('iframe');
      frame.style.width = '100%';
      frame.style.height = '480px';
      frame.style.border = '2px solid #7b61ff';
      frame.style.marginTop = '12px';
      frame.src = './';
      document.body.appendChild(frame);

      var tries = 0;
      var timer = setInterval(function () {
        tries += 1;
        var ready = false;
        try {
          var d = frame.contentDocument;
          ready = !!(d && d.querySelector('header') && d.querySelector('main'));
        } catch (e) {
          /* not ready */
        }
        if (ready) {
          clearInterval(timer);
          setTimeout(measure, 2500);
        } else if (tries > 30) {
          clearInterval(timer);
          var msg = 'DIAG TIMEOUT: main site did not render inside frame after 30s. UA: ' + navigator.userAgent;
          reportEl.textContent = msg;
          statusEl.textContent = '⚠️ সাইট ভেতরে লোডই হয়নি — রিপোর্ট পাঠানো হচ্ছে…';
          sendReport(msg)
            .then(function () {
              statusEl.textContent = '✅ হয়ে গেছে — এখন এই পেজ বন্ধ করতে পারো।';
            })
            .catch(function () {
              statusEl.textContent = '✅ পরীক্ষা শেষ — এই লেখাটার স্ক্রিনশট দাও।';
            });
        }
      }, 1000);

      function measure() {
        try {
          var w = frame.contentWindow;
          var d = frame.contentDocument;
          var lines = [];
          lines.push('UA: ' + navigator.userAgent);
          var se = d.scrollingElement;
          lines.push('scrollHeight: ' + (se ? se.scrollHeight : '?') + ' innerHeight: ' + w.innerHeight);
          lines.push('overflow html: ' + w.getComputedStyle(d.documentElement).overflow + ' / ' + w.getComputedStyle(d.documentElement).overflowX + ',' + w.getComputedStyle(d.documentElement).overflowY);
          lines.push('overflow body: ' + w.getComputedStyle(d.body).overflow + ' / ' + w.getComputedStyle(d.body).overflowX + ',' + w.getComputedStyle(d.body).overflowY);
          var root = d.getElementById('root');
          if (root) lines.push('overflow #root: ' + w.getComputedStyle(root).overflowX + ',' + w.getComputedStyle(root).overflowY);
          var stack = d.elementsFromPoint(w.innerWidth / 2, w.innerHeight / 2);
          var names = [];
          for (var i = 0; i < Math.min(stack.length, 6); i++) {
            var e = stack[i];
            names.push(e.tagName + '.' + String(e.className && e.className.baseVal !== undefined ? e.className.baseVal : e.className).slice(0, 45));
          }
          lines.push('centre stack: ' + names.join(' > '));
          // Anything fixed/absolute covering almost the whole viewport?
          var covers = [];
          var all = d.querySelectorAll('body *');
          for (var j = 0; j < all.length; j++) {
            var el = all[j];
            var cs = w.getComputedStyle(el);
            if (cs.position !== 'fixed' && cs.position !== 'absolute') continue;
            var r = el.getBoundingClientRect();
            if (r.width >= w.innerWidth * 0.95 && r.height >= w.innerHeight * 0.95) {
              covers.push(el.tagName + '.' + String(el.className).slice(0, 45) + ' z=' + cs.zIndex + ' pe=' + cs.pointerEvents + ' op=' + cs.opacity);
            }
          }
          lines.push('fullscreen covers: ' + (covers.length ? covers.join(' | ') : 'none'));
          w.scrollTo(0, 800);
          setTimeout(function () {
            lines.push('scrollY after scrollTo(0,800): ' + Math.round(w.scrollY));
            var btns = d.querySelectorAll('header button');
            lines.push('header buttons: ' + btns.length);
            if (btns.length > 1) {
              var beforeCls = d.documentElement.className;
              btns[1].click();
              setTimeout(function () {
                lines.push('theme click works: ' + (d.documentElement.className !== beforeCls ? 'YES' : 'NO'));
                finish(lines);
              }, 700);
            } else {
              finish(lines);
            }
          }, 700);
        } catch (e) {
          finish(['DIAG ERROR: ' + e, 'UA: ' + navigator.userAgent]);
        }
      }

      function finish(lines) {
        var text = lines.join('\n');
        reportEl.innerHTML = lines.join('<br>');
        statusEl.textContent = '⏳ রিপোর্ট পাঠানো হচ্ছে…';
        sendReport('AUTO-DIAG\n' + text)
          .then(function () {
            statusEl.textContent = '✅ হয়ে গেছে — এখন এই পেজ বন্ধ করতে পারো।';
          })
          .catch(function () {
            statusEl.textContent = '✅ পরীক্ষা শেষ — এই লেখাটার স্ক্রিনশট দাও।';
          });
      }
    </script>
  </body>
</html>
